name: Playwright E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same PR/branch — prevents
# multiple workflow runs racing to upload to the same release tag and posting
# duplicate PR comments.
concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default token has no permissions; each job declares only what it needs.
# The test job executes repo-controlled code (npm ci, build, Playwright tests)
# so it MUST stay read-only — only the report job (no repo code) gets write.
permissions: {}

jobs:
  # Sniff the diff to decide whether the report job should regenerate videos.
  # Content-only PRs (new MDX post, README edit) still run the matrix tests
  # (they catch real regressions when MDX components change), but the expensive
  # stitch + release upload + comment update is skipped.
  detect-changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the diff against the PR base resolves on first push.
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # First push to a new branch sends an all-zeros `before` SHA; fall
          # back to HEAD~1 (or HEAD if shallow) so the diff still produces
          # something meaningful.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          changed=$(git diff --name-only "$base" "$head" || true)
          echo "Changed files between $base and $head:"
          echo "$changed"
          # Paths that do NOT trigger video regeneration:
          #   - content/posts/**     (MDX posts; render through the existing
          #                           pipeline and don't change other pages' UI)
          #   - root-level *.md      (README.md, CLAUDE.md, etc. — docs only)
          # Everything else (app/, components/, styles/, public/, lib/, the
          # tests themselves, the workflow file) is treated as frontend.
          non_frontend='^(content/posts/|[^/]+\.md$)'
          if [ -z "$changed" ] || echo "$changed" | grep -Ev "$non_frontend" | grep -q .; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "→ frontend changes detected; report job will regenerate videos"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "→ content-only diff; report job will be skipped"
          fi

  test:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # mobile-chrome runs only mobile.spec.ts (see playwright.config.ts).
        # Its videos upload as raw artifacts but are not included in the
        # combined PR video — see the stitch step for why.
        browser: [chromium, firefox, webkit, mobile-chrome]

    steps:
      - uses: actions/checkout@v4
        with:
          # Don't persist the install token in .git/config; subsequent npm/build
          # steps would otherwise have read access to it via the working tree.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build app
        run: npm run build

      - name: Start app
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ matrix.browser }}
          path: test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Combined video report
    # Three gates, all required:
    #   1. always() — run even if a matrix test failed (failure videos are
    #      worth seeing).
    #   2. pull_request from this repo — fork tokens are forced read-only
    #      regardless of the permissions block, so release upload + PR
    #      comment would 403.
    #   3. detect-changes says the diff touched frontend code — content-only
    #      PRs leave the previous video comment in place rather than
    #      regenerating identical output.
    if: |
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.detect-changes.outputs.frontend == 'true'
    needs: [detect-changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload release assets
      pull-requests: write   # post PR comment
      issues: write          # /issues/{number}/comments endpoint
    steps:
      - name: Download all browser videos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: playwright-videos-*

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stitch per-browser videos
        id: stitch
        shell: bash
        run: |
          set -e
          mkdir -p stitched
          have_any=0
          # Desktop browsers only. mobile-chrome runs a different test set
          # (mobile.spec.ts), so its concat stream would differ in length
          # from the desktop streams — hstack truncates to the shortest input,
          # which would cut desktop content. Mobile videos are still available
          # as raw artifacts for download.
          for browser in chromium firefox webkit; do
            dir="artifacts/playwright-videos-${browser}"
            [ -d "$dir" ] || continue
            list_file="${browser}-list.txt"
            : > "$list_file"
            # Filter to @multistep tests only. Playwright slugifies the
            # title `…thing @multistep` to `…thing-multistep` (dropping the
            # @), so we look for `-multistep` followed by `-` or `/` to
            # anchor the match inside a test-directory name and avoid
            # accidentally matching the substring elsewhere in the path.
            # Convention documented in playwright.config.ts and
            # tests/e2e/multistep.spec.ts. All videos are still uploaded as
            # raw artifacts above; this filter only affects the stitched MP4.
            while IFS= read -r f; do
              printf "file '%s'\n" "$(realpath "$f")" >> "$list_file"
            done < <(find "$dir" -name '*.webm' | grep -E -- '-multistep[-/]' | sort)
            if [ ! -s "$list_file" ]; then
              echo "no webm files for $browser"
              continue
            fi
            # Re-encode each concatenated stream to a normalised mp4 so hstack works
            ffmpeg -y -f concat -safe 0 -i "$list_file" \
              -c:v libx264 -pix_fmt yuv420p \
              -vf "scale=640:360:force_original_aspect_ratio=decrease,pad=640:360:(ow-iw)/2:(oh-ih)/2,setsar=1,drawtext=text='${browser}':x=10:y=10:fontcolor=white:fontsize=20:box=1:boxcolor=black@0.5:boxborderw=4" \
              -an -r 30 "stitched/${browser}.mp4"
            have_any=1
          done
          echo "have_any=${have_any}" >> "$GITHUB_OUTPUT"

      - name: Build combined MP4 + animated WebP
        if: steps.stitch.outputs.have_any == '1'
        id: build
        shell: bash
        run: |
          set -e
          inputs=()
          n=0
          for browser in chromium firefox webkit; do
            f="stitched/${browser}.mp4"
            if [ -f "$f" ]; then
              inputs+=("-i" "$f")
              n=$((n + 1))
            fi
          done
          if [ "$n" -eq 1 ]; then
            cp stitched/*.mp4 combined.mp4
          else
            ffmpeg -y "${inputs[@]}" \
              -filter_complex "hstack=inputs=${n}" \
              -c:v libx264 -pix_fmt yuv420p -movflags +faststart combined.mp4
          fi
          # Animated WebP — 8fps, capped width 1200 for inline embed
          ffmpeg -y -i combined.mp4 \
            -vf "fps=8,scale='min(1200,iw)':-2:flags=lanczos" \
            -loop 0 -q:v 55 combined.webp
          ls -lah combined.*
          # `wc -c` is portable; `stat -c%s` would be GNU-only. Runners are
          # ubuntu-latest today but a portable form costs nothing.
          echo "mp4_size=$(wc -c < combined.mp4)" >> "$GITHUB_OUTPUT"
          echo "webp_size=$(wc -c < combined.webp)" >> "$GITHUB_OUTPUT"

      - name: Upload combined assets to PR release
        if: steps.stitch.outputs.have_any == '1'
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request.number;
            const tag = 'playwright-pr-videos';
            const releaseName = 'Playwright PR run videos';

            let release;
            try {
              const r = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag
              });
              release = r.data;
            } catch (e) {
              const r = await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: tag, name: releaseName,
                body: 'Auto-generated Playwright run videos. Assets named `pr-<N>-combined.*`.',
                draft: false, prerelease: true
              });
              release = r.data;
            }

            const assetNames = [`pr-${pr}-combined.mp4`, `pr-${pr}-combined.webp`];
            const existing = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, per_page: 100
            });
            for (const a of existing.data) {
              if (assetNames.includes(a.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner, repo: context.repo.repo, asset_id: a.id
                });
              }
            }

            const urls = {};
            for (const [localName, assetName] of [
              ['combined.mp4', `pr-${pr}-combined.mp4`],
              ['combined.webp', `pr-${pr}-combined.webp`],
            ]) {
              if (!fs.existsSync(localName)) continue;
              const data = fs.readFileSync(localName);
              const r = await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: release.id, name: assetName, data
              });
              urls[localName] = r.data.browser_download_url;
            }
            core.setOutput('mp4_url', urls['combined.mp4'] || '');
            core.setOutput('webp_url', urls['combined.webp'] || '');

      - name: Upsert PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- playwright-video-report -->';
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            // The three values interpolated below are workflow-internal:
            //   - have_any: a 0/1 flag set by the stitch step
            //   - webp_url / mp4_url: GitHub-issued release asset URLs
            // None are user-controlled. NEVER expand this set to include any
            // field derived from PR title, body, branch name, or other
            // attacker-influenceable input — `${{ … }}` interpolated into a
            // JS string literal is a script-injection vector. If that's ever
            // needed, plumb the value through `env:` and read it with
            // `process.env.X` instead.
            const haveVideo = '${{ steps.stitch.outputs.have_any }}' === '1';
            const webpUrl = '${{ steps.release.outputs.webp_url }}';
            const mp4Url = '${{ steps.release.outputs.mp4_url }}';

            const lines = [
              marker,
              `### 🎬 Playwright run · chromium │ firefox │ webkit`,
              ``,
              `Commit \`${sha}\` · [workflow run](${runUrl})`,
              ``,
            ];
            if (haveVideo && webpUrl) {
              lines.push(`![combined playwright run](${webpUrl})`);
              lines.push(``);
              if (mp4Url) lines.push(`**Full-quality MP4:** [download](${mp4Url})`);
            } else {
              lines.push(`_No videos produced this run (all browser jobs failed before recording, or no tests ran)._`);
            }
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100
            });
            // Also constrain by author to prevent marker hijack — only edit
            // comments we ourselves posted.
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body
              });
            }
